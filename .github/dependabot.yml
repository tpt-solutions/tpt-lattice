version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"
    ignore:
      # tpt-lattice-wasm intentionally pins two semver-incompatible major
      # versions of getrandom side by side (via the `getrandom4` package
      # alias) to enable the `wasm_js` backend for whichever version each
      # transitive dependency in the graph pulls in. Bumping the plain
      # `getrandom` requirement collapses both entries onto the same
      # version, which Cargo rejects ("depends on crate `getrandom`
      # multiple times with different names"). Update this pin by hand.
      - dependency-name: "getrandom"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "frontend"
    ignore:
      # typescript-eslint (a direct dependency) only supports TypeScript
      # <6.1.0 as of its latest release, so bumping typescript to 7.x makes
      # `npm ci` fail with an ERESOLVE peer-dependency conflict. Bump this
      # once typescript-eslint adds TS 7 support.
      - dependency-name: "typescript"
