[workspace]
resolver = "2"
members = [
    "crates/tpt-lattice-core",
    "crates/tpt-lattice-parser",
    "crates/tpt-lattice-evaluator",
    "crates/tpt-lattice-crdt",
    "crates/tpt-lattice-io",
    "crates/tpt-lattice-import-xlsx",
    "crates/tpt-lattice-wasm",
    "crates/tpt-lattice-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tpt-solutions/tpt-lattice"
authors = ["TPT Solutions"]
description = "A next-generation, real-time collaborative spreadsheet engine built from first principles."

[workspace.dependencies]
tpt-lattice-core = { path = "crates/tpt-lattice-core", version = "0.1.0" }
tpt-lattice-parser = { path = "crates/tpt-lattice-parser", version = "0.1.0" }
tpt-lattice-evaluator = { path = "crates/tpt-lattice-evaluator", version = "0.1.0" }
tpt-lattice-crdt = { path = "crates/tpt-lattice-crdt", version = "0.1.0" }
tpt-lattice-io = { path = "crates/tpt-lattice-io", version = "0.1.0" }

serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = "1.0"
thiserror = { version = "1.0", default-features = false }
nom = { version = "7.1", default-features = false, features = ["alloc"] }
petgraph = "0.6"
rmp-serde = "1.3"
calamine = "0.24"
wasm-bindgen = "0.2"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
ulid = "1.1"
proptest = "1.4"
