[package]
name = "tpt-lattice-import-xlsx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Opt-in translation of legacy .xlsx workbooks into TPT Lattice primitives."
keywords = ["spreadsheet", "xlsx", "import", "excel"]
categories = ["parsing"]

[dependencies]
tpt-lattice-core = { workspace = true, features = ["serde"] }
calamine = { workspace = true }
# Direct xlsx (OOXML zip) access for merged cells and per-cell styles, which
# `calamine` does not surface. Both are already in the lockfile via calamine.
zip = "8.6"
quick-xml = "0.31"
