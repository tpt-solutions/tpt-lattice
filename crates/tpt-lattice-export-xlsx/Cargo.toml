[package]
name = "tpt-lattice-export-xlsx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Write TPT Lattice grids to legacy .xlsx (OOXML) workbooks."
keywords = ["spreadsheet", "xlsx", "export", "excel"]
categories = ["encoding"]

[dependencies]
tpt-lattice-core = { workspace = true, features = ["serde"] }
tpt-lattice-io = { workspace = true }
# OOXML is a zip container; we author the parts directly with the strings API so
# the writer has no heavy XML dependency.
zip = "8.6"
