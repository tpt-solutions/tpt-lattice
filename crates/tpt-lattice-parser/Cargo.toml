[package]
name = "tpt-lattice-parser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Lexer and parser for the Lattice Expression Syntax (LES). no_std compatible."
keywords = ["spreadsheet", "parser", "expression", "no_std"]
categories = ["parsing"]

[dependencies]
tpt-lattice-core = { workspace = true }
nom = { workspace = true }
serde = { workspace = true, optional = true }

[features]
default = []
serde = ["dep:serde", "tpt-lattice-core/serde"]

[dev-dependencies]
proptest = { workspace = true }
