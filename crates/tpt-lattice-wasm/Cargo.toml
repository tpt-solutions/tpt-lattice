[package]
name = "tpt-lattice-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "wasm-bindgen glue exposing the TPT Lattice engine to JavaScript via a Web Worker."
keywords = ["spreadsheet", "wasm", "webassembly", "bindgen"]
categories = ["wasm"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tpt-lattice-core = { workspace = true, features = ["serde"] }
tpt-lattice-parser = { workspace = true, features = ["serde"] }
tpt-lattice-evaluator = { workspace = true }
tpt-lattice-crdt = { workspace = true }
wasm-bindgen = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
js-sys = "0.3"

# `ulid` pulls in `rand` -> `getrandom`, which needs the `wasm_js` backend to
# compile for the browser wasm target. `rand`/`getrandom` themselves span two
# semver-incompatible major versions in the dependency graph (via different
# transitive requirers), so both are enabled here. This is only enabled for
# wasm builds so host/test builds are unaffected.
[target.wasm32-unknown-unknown.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom4 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
